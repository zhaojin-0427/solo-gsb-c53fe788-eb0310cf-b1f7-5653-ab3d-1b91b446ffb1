services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vibration
      POSTGRES_PASSWORD: vibration
      POSTGRES_DB: vibration
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibration -d vibration || pg_isready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://vibration:vibration@db:5432/vibration
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
